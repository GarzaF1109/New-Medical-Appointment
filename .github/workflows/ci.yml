name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — lint, tipos y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Linter (ruff)
        run: ruff check src tests

      - name: Formato (ruff)
        run: ruff format --check src tests

      - name: Tipos (mypy)
        run: mypy src

      - name: Pruebas con cobertura
        # El umbral de 80% esta declarado en pyproject.toml y hace fallar el job.
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend — tipos, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc -b --noEmit

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

  docker:
    name: Imagenes de contenedor
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Construir imagenes
        run: docker compose build

      - name: Verificar que la pila levanta
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Backend saludable"; exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Apagar
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright — pruebas E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Levantar la pila
        run: docker compose up --build -d

      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Backend saludable"; exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar navegadores de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E contra la pila de Docker
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8085
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Publicar reporte de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Apagar
        if: always()
        run: docker compose down -v

  security-zap:
    name: OWASP ZAP — analisis dinamico automatizado
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Solo reporta: un hallazgo de ZAP requiere juicio humano (ver
    # docs/security/owasp-zap.md), asi que nunca tumba el pipeline.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Levantar la pila
        run: docker compose up --build -d

      - name: Correr OWASP ZAP (API scan + baseline scan)
        run: ./ops/zap/run-zap.sh

      - name: Publicar reportes de ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: docs/security/zap-reports/
          retention-days: 14

      - name: Apagar
        if: always()
        run: docker compose down -v
