server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # La API se sirve bajo el mismo origen para evitar CORS en produccion.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger y el esquema, para poder explorar la API desde el mismo origen.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Toda ruta desconocida cae en index.html (enrutado del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
