server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Cabeceras de seguridad, detectadas como ausentes por el baseline scan de
    # OWASP ZAP (ver docs/security/owasp-zap.md). La CSP permite 'self' porque
    # la SPA carga su propio JS/CSS generado por Vite; Swagger vive en el
    # backend detras de /docs, fuera de esta politica.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # base-uri, form-action y frame-ancestors no heredan de default-src por
    # especificacion de CSP, asi que hay que declararlos aparte.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # La API se sirve bajo el mismo origen para evitar CORS en produccion.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger y el esquema, para poder explorar la API desde el mismo origen.
    # Nginx NO hereda los add_header del server una vez que el location
    # declara los suyos, asi que hay que repetirlos aqui -sin la CSP
    # estricta de arriba- para no romper los assets de Swagger (su JS/CSS
    # vienen de un CDN, que `script-src 'self'` bloquearia).
    location ~ ^/(docs|redoc|openapi\.json) {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Toda ruta desconocida cae en index.html (enrutado del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
